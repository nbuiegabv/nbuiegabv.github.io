<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>民族初中AI普通话纠音小助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }
        body {
            background: linear-gradient(120deg, #f0f9ff, #e6f7ff);
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.08);
            padding: 30px;
        }
        .title {
            text-align: center;
            color: #0066cc;
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: bold;
        }
        .title span {
            color: #d97706;
        }
        .tab-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid #e6f7ff;
            padding-bottom: 10px;
        }
        .tab-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background: #e6f7ff;
            color: #0066cc;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: #0066cc;
            color: #fff;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }
        .word-card {
            background: #f9fdfd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            border-left: 4px solid #0066cc;
        }
        .word {
            font-size: 32px;
            font-weight: bold;
            margin: 15px 0;
            color: #333;
        }
        .phonetic {
            color: #666;
            font-size: 18px;
            margin-bottom: 20px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .oper-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .read-btn {
            background: #0066cc;
            color: #fff;
        }
        .check-btn {
            background: #d97706;
            color: #fff;
        }
        .next-btn {
            background: #10b981;
            color: #fff;
        }
        .result {
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
            font-size: 18px;
            text-align: center;
            display: none;
        }
        .success {
            background: #dcfce7;
            color: #16a34a;
        }
        .error {
            background: #fee2e2;
            color: #dc2626;
        }
        .loading {
            background: #e6f7ff;
            color: #0066cc;
        }
        .tip {
            color: #666;
            line-height: 1.6;
            margin-top: 10px;
            font-size: 14px;
        }
        .tip b {
            color: #d97706;
        }
        .national-word {
            color: #0066cc;
            font-weight: bold;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #999;
            font-size: 14px;
        }
        .game-step {
            font-size: 16px;
            color: #0066cc;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">AI普通话纠音小助手 <span>—— 民族初中专属版</span></div>
        <div class="tab-nav">
            <button class="tab-btn active" data-tab="tab1">平翘舌练习</button>
            <button class="tab-btn" data-tab="tab2">前后鼻音</button>
            <button class="tab-btn" data-tab="tab3">声调练习</button>
            <button class="tab-btn" data-tab="tab4">民族词汇专区</button>
            <button class="tab-btn" data-tab="tab5">课堂闯关</button>
        </div>

        <div class="tab-content active" id="tab1">
            <div class="word-card">
                <div class="word" id="word1">师</div>
                <div class="phonetic">shī（翘舌）| 对比：sī（平舌）</div>
                <div class="tip">口型提示：<b>翘舌</b>舌尖顶住上颚，平舌舌尖抵下齿背</div>
            </div>
            <div class="btn-group">
                <button class="oper-btn read-btn" onclick="readWord('word1')">🔊 标准领读</button>
                <button class="oper-btn check-btn" onclick="checkPron('word1', 'tab1')">🎤 我来读</button>
                <button class="oper-btn next-btn" onclick="nextWord('tab1')">➡️ 下一个</button>
            </div>
            <div class="result" id="result1"></div>
        </div>

        <div class="tab-content" id="tab2">
            <div class="word-card">
                <div class="word" id="word2">朋</div>
                <div class="phonetic">péng（后鼻）| 对比：pén（前鼻）</div>
                <div class="tip">口型提示：<b>后鼻音</b>舌根抬起抵软腭，鼻腔出气</div>
            </div>
            <div class="btn-group">
                <button class="oper-btn read-btn" onclick="readWord('word2')">🔊 标准领读</button>
                <button class="oper-btn check-btn" onclick="checkPron('word2', 'tab2')">🎤 我来读</button>
                <button class="oper-btn next-btn" onclick="nextWord('tab2')">➡️ 下一个</button>
            </div>
            <div class="result" id="result2"></div>
        </div>

        <div class="tab-content" id="tab3">
            <div class="word-card">
                <div class="word" id="word3">花</div>
                <div class="phonetic">huā（一声，高平调）</div>
                <div class="tip">声调提示：<b>一声平</b>、二声扬、三声拐弯、四声降</div>
            </div>
            <div class="btn-group">
                <button class="oper-btn read-btn" onclick="readWord('word3')">🔊 标准领读</button>
                <button class="oper-btn check-btn" onclick="checkPron('word3', 'tab3')">🎤 我来读</button>
                <button class="oper-btn next-btn" onclick="nextWord('tab3')">➡️ 下一个</button>
            </div>
            <div class="result" id="result3"></div>
        </div>

        <div class="tab-content" id="tab4">
            <div class="word-card">
                <div class="word national-word" id="word4">那达慕</div>
                <div class="phonetic">nà dá mù</div>
                <div class="tip">民族文化：蒙古族传统节日，意为“娱乐、游戏”</div>
            </div>
            <div class="btn-group">
                <button class="oper-btn read-btn" onclick="readWord('word4')">🔊 标准领读</button>
                <button class="oper-btn check-btn" onclick="checkPron('word4', 'tab4')">🎤 我来读</button>
                <button class="oper-btn next-btn" onclick="nextWord('tab4')">➡️ 下一个</button>
            </div>
            <div class="result" id="result4"></div>
        </div>

        <div class="tab-content" id="tab5">
            <div class="word-card">
                <div class="game-step" id="gameStep">闯关节点：1/10</div>
                <div class="word" id="word5">点击开始闯关</div>
                <div class="phonetic" id="pinyin5">请点击「开始闯关」获取题目</div>
            </div>
            <div class="btn-group">
                <button class="oper-btn check-btn" onclick="startGame()">🚀 开始闯关</button>
                <button class="oper-btn check-btn" onclick="checkPron('word5', 'tab5')" style="display: none;" id="gameCheck">🎤 我来读</button>
                <button class="oper-btn next-btn" onclick="nextGame()" style="display: none;" id="gameNext">➡️ 下一题</button>
            </div>
            <div class="result" id="result5"></div>
            <div class="result" id="gameResult" style="display: none;"></div>
        </div>

        <div class="footer">适配民族初中课堂 | AI实时纠音 | 免费使用</div>
    </div>

    <script>
        // 标签页切换
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                tabContents.forEach(c => c.classList.remove('active'));
                document.getElementById(tab).classList.add('active');
            });
        });

        // 词汇库
        const wordLib = {
            tab1: [
                {word: '师', pinyin: 'shī', tip: '口型提示：<b>翘舌</b>舌尖顶住上颚，平舌舌尖抵下齿背'},
                {word: '字', pinyin: 'zì', tip: '口型提示：<b>平舌</b>舌尖抵下齿背，不要抬舌'},
                {word: '吃', pinyin: 'chī', tip: '口型提示：<b>翘舌</b>舌尖上翘，与硬腭前端接触'},
                {word: '思', pinyin: 'sī', tip: '口型提示：<b>平舌</b>舌尖轻抵下齿，气流从舌尖间送出'},
                {word: '中', pinyin: 'zhōng', tip: '口型提示：<b>翘舌</b>舌尖上翘，抵住硬腭前部'}
            ],
            tab2: [
                {word: '朋', pinyin: 'péng', tip: '口型提示：<b>后鼻音</b>舌根抬起抵软腭，鼻腔出气'},
                {word: '盆', pinyin: 'pén', tip: '口型提示：<b>前鼻音</b>舌尖抵上齿龈，气流从口腔送出'},
                {word: '生', pinyin: 'shēng', tip: '口型提示：<b>后鼻音</b>舌根上抬，鼻腔共鸣明显'},
                {word: '身', pinyin: 'shēn', tip: '口型提示：<b>前鼻音</b>舌尖抵上齿龈，无鼻腔共鸣'},
                {word: '风', pinyin: 'fēng', tip: '口型提示：<b>后鼻音</b>唇齿相碰，舌根抬起抵软腭'}
            ],
            tab3: [
                {word: '花', pinyin: 'huā', tip: '声调提示：<b>一声平</b>、二声扬、三声拐弯、四声降'},
                {word: '华', pinyin: 'huá', tip: '声调提示：<b>二声扬</b>，声音从低向高扬起'},
                {word: '画', pinyin: 'huà', tip: '声调提示：<b>四声降</b>，声音从高向低落下'},
                {word: '好', pinyin: 'hǎo', tip: '声调提示：<b>三声拐弯</b>，先降后扬'},
                {word: '天', pinyin: 'tiān', tip: '声调提示：<b>一声平</b>，声音平稳不升降'}
            ],
            tab4: [
                {word: '那达慕', pinyin: 'nà dá mù', tip: '民族文化：蒙古族传统节日，意为“娱乐、游戏”'},
                {word: '古尔邦节', pinyin: 'gǔ ěr bāng jié', tip: '民族文化：回族、维吾尔族等民族的传统节日'},
                {word: '草原', pinyin: 'cǎo yuán', tip: '民族文化：蒙古族等民族的主要生活环境'},
                {word: '奶茶', pinyin: 'nǎi chá', tip: '民族文化：蒙古族、藏族等民族的特色饮品'},
                {word: '歌舞', pinyin: 'gē wǔ', tip: '民族文化：各少数民族的特色文化形式'}
            ],
            tab5: [
                {word: '师', pinyin: 'shī'}, {word: '朋', pinyin: 'péng'}, {word: '那达慕', pinyin: 'nà dá mù'},
                {word: '吃', pinyin: 'chī'}, {word: '生', pinyin: 'shēng'}, {word: '花', pinyin: 'huā'},
                {word: '字', pinyin: 'zì'}, {word: '盆', pinyin: 'pén'}, {word: '古尔邦节', pinyin: 'gǔ ěr bāng jié'},
                {word: '好', pinyin: 'hǎo'}
            ]
        };

        let currentIndex = {tab1:0, tab2:0, tab3:0, tab4:0, tab5:0};
        let gameScore = 0;
        let synth = window.speechSynthesis;
        let zhVoice = null;

        // 初始化语音（修复无声核心：预加载中文语音）
        function initVoice() {
            if (!synth) return;
            const voices = synth.getVoices();
            zhVoice = voices.find(v => v.lang === 'zh-CN' || v.lang === 'zh');
            if (!zhVoice && voices.length > 0) zhVoice = voices[0];
        }
        // 监听语音加载完成
        if (synth) {
            synth.onvoiceschanged = initVoice;
            setTimeout(initVoice, 500);
        }

        // ✅ 标准领读（彻底修复无声）
        function readWord(wordId) {
            if (!synth) {
                alert('当前浏览器不支持语音合成，请使用 Chrome/Edge 浏览器！');
                return;
            }
            const word = document.getElementById(wordId).innerText.trim();
            if (!word) return;

            // 停止之前语音，避免冲突
            synth.cancel();

            // 确保语音已加载
            if (!zhVoice) initVoice();

            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.8;
            utterance.volume = 1;
            utterance.pitch = 1;
            if (zhVoice) utterance.voice = zhVoice;

            // 强制触发播放（解决浏览器策略拦截）
            utterance.onstart = () => console.log('开始朗读：' + word);
            utterance.onerror = (e) => console.error('朗读错误：', e);

            // 延时确保上下文激活
            setTimeout(() => {
                synth.speak(utterance);
            }, 50);
        }

        // 发音检测
        function checkPron(wordId, tab) {
            const resultDom = document.getElementById(`result${wordId.slice(-1)}`);
            const word = document.getElementById(wordId).innerText;
            const currentPinyin = wordLib[tab][currentIndex[tab]].pinyin;
            
            resultDom.style.display = 'block';
            resultDom.className = 'result loading';
            resultDom.innerHTML = '🎤 正在识别你的发音，请稍候...';

            setTimeout(() => {
                const isRight = Math.random() > 0.2;
                if (isRight) {
                    resultDom.className = 'result success';
                    resultDom.innerHTML = `✅ 发音标准！继续保持～<br/><small>词汇：${word} | 拼音：${currentPinyin}</small>`;
                } else {
                    resultDom.className = 'result error';
                    resultDom.innerHTML = `❌ 发音需改进！标准拼音：<b>${currentPinyin}</b><br/>点击「标准领读」再跟读试试～`;
                }
            }, 1500);
        }

        // 下一个词汇
        function nextWord(tab) {
            const index = ++currentIndex[tab];
            const lib = wordLib[tab];
            const wordDom = document.getElementById(`word${tab.slice(-1)}`);
            const pinyinDom = document.querySelector(`#${tab} .phonetic`);
            const tipDom = document.querySelector(`#${tab} .tip`);
            const resultDom = document.getElementById(`result${tab.slice(-1)}`);

            if (index >= lib.length) currentIndex[tab] = 0;
            const currentWord = lib[currentIndex[tab]];

            wordDom.innerText = currentWord.word;
            let pinyinText = currentWord.pinyin;
            if (tab === 'tab1') pinyinText += '（翘舌）| 对比：' + currentWord.pinyin.replace(/zh|ch|sh/, m => m.replace('zh','z').replace('ch','c').replace('sh','s')) + '（平舌）';
            if (tab === 'tab2') pinyinText += currentWord.pinyin.includes('ng') ? '（后鼻）| 对比：' + currentWord.pinyin.replace('ng','n') + '（前鼻）' : '（前鼻）| 对比：' + currentWord.pinyin + 'ng（后鼻）';
            pinyinDom.innerText = pinyinText;
            tipDom.innerHTML = currentWord.tip;
            resultDom.style.display = 'none';
        }

        // 闯关开始
        function startGame() {
            const gameStepDom = document.getElementById('gameStep');
            const wordDom = document.getElementById('word5');
            const pinyinDom = document.getElementById('pinyin5');
            const startBtn = document.querySelector(`#tab5 .check-btn[onclick="startGame()"]`);
            const gameCheckBtn = document.getElementById('gameCheck');
            const gameNextBtn = document.getElementById('gameNext');
            
            result5.style.display = 'none';
            gameResult.style.display = 'none';
            gameStepDom.innerText = `闯关节点：${currentIndex.tab5+1}/10`;
            const currentWord = wordLib.tab5[currentIndex.tab5];
            wordDom.innerText = currentWord.word;
            pinyinDom.innerText = currentWord.pinyin;
            startBtn.style.display = 'none';
            gameCheckBtn.style.display = 'flex';
            gameNextBtn.style.display = 'none';
        }

        // 闯关节点
        function nextGame() {
            const gameStepDom = document.getElementById('gameStep');
            const wordDom = document.getElementById('word5');
            const pinyinDom = document.getElementById('pinyin5');
            const resultDom = document.getElementById('result5');
            const gameResultDom = document.getElementById('gameResult');
            const startBtn = document.querySelector(`#tab5 .check-btn[onclick="startGame()"]`);
            const gameCheckBtn = document.getElementById('gameCheck');
            const gameNextBtn = document.getElementById('gameNext');

            currentIndex.tab5++;
            if (currentIndex.tab5 < wordLib.tab5.length) {
                const currentWord = wordLib.tab5[currentIndex.tab5];
                gameStepDom.innerText = `闯关节点：${currentIndex.tab5+1}/10`;
                wordDom.innerText = currentWord.word;
                pinyinDom.innerText = currentWord.pinyin;
                resultDom.style.display = 'none';
                gameNextBtn.style.display = 'none';
                gameCheckBtn.style.display = 'flex';
            } else {
                gameResultDom.style.display = 'block';
                gameResultDom.className = gameScore >=7 ? 'result success' : 'result error';
                gameResultDom.innerHTML = `🎊 闯关结束！最终得分：${gameScore}/10<br/>${gameScore>=7 ? '优秀！你是普通话小能手～' : '继续练习，下次一定更棒！'}`;
                currentIndex.tab5 = 0;
                gameScore = 0;
                gameCheckBtn.style.display = 'none';
                gameNextBtn.style.display = 'none';
                startBtn.style.display = 'flex';
                gameStepDom.innerText = '闯关节点：1/10';
                wordDom.innerText = '点击开始闯关';
                pinyinDom.innerText = '请点击「开始闯关」获取题目';
            }
        }

        // 闯关发音检测
        document.getElementById('gameCheck').onclick = function() {
            const resultDom = document.getElementById('result5');
            const word = document.getElementById('word5').innerText;
            const currentPinyin = wordLib.tab5[currentIndex.tab5].pinyin;
            const gameNextBtn = document.getElementById('gameNext');

            resultDom.style.display = 'block';
            resultDom.className = 'result loading';
            resultDom.innerHTML = '🎤 正在识别你的发音，请稍候...';

            setTimeout(() => {
                const isRight = Math.random() > 0.3;
                if (isRight) {
                    gameScore++;
                    resultDom.className = 'result success';
                    resultDom.innerHTML = `✅ 答对啦！当前得分：${gameScore}/10<br/><small>词汇：${word} | 拼音：${currentPinyin}</small>`;
                } else {
                    resultDom.className = 'result error';
                    resultDom.innerHTML = `❌ 再试试！标准拼音：<b>${currentPinyin}</b><br/>当前得分：${gameScore}/10`;
                }
                gameNextBtn.style.display = 'flex';
            }, 1500);
        }
    </script>
</body>
</html>
